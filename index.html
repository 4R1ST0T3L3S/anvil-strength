<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/logo-black.svg" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- El tema es oscuro únicamente: se declara para que el navegador pinte los
       controles nativos y la barra de estado en oscuro desde el primer frame,
       en vez de dar un destello blanco antes de que cargue el CSS. -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- SEO Primary -->
  <title>Anvil Strength | Club de Powerlifting Online en España — Gratis</title>
  <meta name="description" content="Anvil Strength es el club de powerlifting digital de España. Gratis, sin sede física, afiliado AEP e IPF. Entrenadores de élite, app exclusiva y comunidad real. ¿Empezamos?" />
  <!-- `keywords` lo ignoran todos los buscadores desde hace años. Se mantiene
       porque no hace daño y documenta la intención de búsqueda del sitio. -->
  <meta name="keywords" content="powerlifting españa, club powerlifting online, powerlifting principiantes, federarse powerlifting AEP, club digital powerlifting, anvil strength" />
  <!-- Sin max-image-preview:large, Google recorta la miniatura de la portada a
       un cuadrado pequeño en resultados y en Discover. -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="author" content="Anvil Strength" />
  <link rel="canonical" href="https://anvilstrength.es/" />
  <link rel="alternate" hreflang="es-ES" href="https://anvilstrength.es/" />
  <link rel="alternate" hreflang="x-default" href="https://anvilstrength.es/" />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://anvilstrength.es/" />
  <meta property="og:title" content="Anvil Strength | Club de Powerlifting Online en España" />
  <meta property="og:description" content="Club digital de powerlifting, 100% gratuito, afiliado AEP + IPF. Entrenadores de élite, app exclusiva y comunidad real. El powerlifting es para todos." />
  <meta property="og:image" content="https://anvilstrength.es/portadaanvil2.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Atletas de Anvil Strength entrenando powerlifting" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="Anvil Strength" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Anvil Strength | Club de Powerlifting Online en España" />
  <meta name="twitter:description" content="Club digital de powerlifting, 100% gratuito, afiliado AEP + IPF. El powerlifting es para todos." />
  <meta name="twitter:image" content="https://anvilstrength.es/portadaanvil2.jpg" />
  <meta name="twitter:image:alt" content="Atletas de Anvil Strength entrenando powerlifting" />

  <!-- Schema.org: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SportsOrganization",
    "name": "Anvil Strength",
    "url": "https://anvilstrength.es",
    "logo": "https://anvilstrength.es/logo.svg",
    "description": "Club de powerlifting digital afiliado a la AEP e IPF. Gratuito, para toda España.",
    "sport": "Powerlifting",
    "email": "anvilstrengthclub@gmail.com",
    "sameAs": [
      "https://www.instagram.com/anvilstrength_"
    ],
    "memberOf": [
      {
        "@type": "SportsOrganization",
        "name": "Asociación Española de Powerlifting",
        "url": "https://powerliftingspain.es/"
      },
      {
        "@type": "SportsOrganization",
        "name": "International Powerlifting Federation",
        "url": "https://www.powerlifting.sport/"
      }
    ]
  }
  </script>

  <!-- El esquema de FAQPage NO va aquí: en una SPA, un bloque en index.html se
       declara en todas las rutas, y /competiciones o las páginas legales
       estarían afirmando contener unas preguntas frecuentes que no tienen.
       Lo genera FAQSection.tsx a partir del mismo array que pinta. -->

  <!-- Preload / Prefetch -->
  <!-- La portada es el elemento LCP. `fetchpriority` la saca de la cola de
       prioridad baja en la que el navegador mete las imágenes por defecto. -->
  <link rel="preload" href="/portadaanvil2.jpg" as="image" fetchpriority="high" />
  <link rel="prefetch" href="/normativa.pdf" />
  <!-- La primera consulta a Supabase sale en cuanto monta la app; abrir la
       conexión TLS en paralelo con el JS ahorra el ida y vuelta del handshake. -->
  <link rel="preconnect" href="https://ihcyuoczbmjxfinxvzra.supabase.co" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
